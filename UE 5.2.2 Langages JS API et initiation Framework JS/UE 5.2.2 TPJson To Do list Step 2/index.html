<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Catherine et Laurent">
    <meta name="description" content="Page de saisie des tâches d'une to do list">
    <meta name="keywords" content="TO do list, tâche, priorité">
    <title>Création de Tâche - To-Do List: Le formulaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root{
            --primary-color: #5370b7;
            --secondary-color: #b753a2;
            --tertiary-color: #b79a53;
            --quaternary-color: #53b768;
            --border-radius: 10px;
            --title-font : 'Playfair Display';
            --body-font : 'Lato';
            --main-font-size: 16px;
            --font-color: #2b2b2b;
            --linear-gradient-bg-body: linear-gradient(90deg, #7189c4,#5370b7,#7189c4);
        }

        body {
            font-family: "var(--body-font)", sans-serif;
            background: var(--linear-gradient-bg-body);
            min-height: 100vh;
            padding: 2rem 5rem ;
            color: var(--font-color);
        }
        input, select, textarea, button{
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem;
            border: 2px solid var(--tertiary-color);
            border-radius: var(--border-radius);
            font-family: "var(--body-font)", sans-serif;
            font-size: 1rem;
        }
        .nameSurname{
            width: 100%;
            text-align: end;
        }
        .container{
            display: grid;
            grid-template-areas: "header header header"
                                "article article article";

        }
        .main__header{
            grid-area: header;
        }

        .main__header--title{
            font-family: "var(--title-font)", serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .main__content{
            grid-area: article;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 2.5rem;

        }
        .main__content--title{
            font-family: "var(--title-font)", serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            border: 2px solid var(--tertiary-color);
            border-radius: var(--border-radius);
        }
        .form-group{

            width: 100%;
            background-color: var(--quaternary-color);
            padding: 2rem;
            border-radius: var(--border-radius);
            border: 2px solid var(--tertiary-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group__container{
            display: grid;
            gap: 1rem;
            grid-template-areas:    "person-in-charge  person-in-charge ."
                                    "description-and-label programming-and-deadline subTaskFieldset"
                                    " documentation-and-files documentation-and-files validation-fieldset";

        }
        #person-in-charge{
            grid-area: person-in-charge;
            border: none;
            display: flex;
            flex-flow: row nowrap;
            align-items: center;
            width: 100%;

        }
        #description-and-label{
            grid-area: description-and-label;
        }
        #programming-and-deadline{
            grid-area: programming-and-deadline;
        }
        #documentation-and-files{
            grid-area: documentation-and-files;
        }
        #validation-fieldset{
            grid-area: validation-fieldset;
        }
        #subTaskFieldset{
            grid-area: subTaskFieldset;
            display: flex;
            flex-flow: column nowrap;
            gap: 1rem;

        }
        .form-group__fieldset{
            display: flex;
            flex-flow: column nowrap;
            width: 100%;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: var(--border-radius);
            height: fit-content;
        }
       input[type="email"]:valid{
        border: 2px double var(--primary-color);
        background-color: var(--tertiary-color);
    }
       /* input[type="email"]:invalid{
            border: 2px double darkred;
            background-color: pink;
        }
        input[type="file"]::-webkit-file-upload-button, input[type="file"]::file-selector-button{
            border: none;
            background-color: var(--quaternary-color);
        }
*/
        #fichiers_joints{
            opacity: 0;
            position: absolute;
            z-index: -1;
            width: 1px;
            height: 1px;
        }
        .button__upload--personalize{
            display: inline-block;
            padding: 1rem;
            color: #fff;
            background-color: var(--secondary-color);
            border: 2px solid var(--tertiary-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
        }
        .button__upload--personalize:hover{
            background-color: var(--primary-color);
            color:var(--secondary-color);
        }

    </style>
</head>
<body>
<main class="container">
    <header class="main__header">
        <h1 class="main__header--title">Nouvelle Tâche</h1>
    </header>
    <article class="main__content">
        <h2 class="main__content--title">Créer une nouvelle tâche</h2>
        <section class="form-group">
            <form class="form-group__container" action="#" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" value="">
                <fieldset class="form-group__fieldset" id="person-in-charge">
                    <legend class="form-group__fieldset--legend">Personne en charge:</legend>
                    <label for="assignation" class="nameSurname">Nom et prénom</label>
                    <input type="text" id="assignation" name="assignation">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="saisissez votre email" required>
                </fieldset>
                <fieldset class="form-group__fieldset" id="description-and-label">
                    <legend class="form-group__fieldset--legend">Libellé et description:</legend>
                    <label for="libelle">Libellé</label>
                    <input type="text" id="libelle" name="libelle">
                    <label for="academicSubject">Matière</label>
                    <select id="academicSubject" name="academicSubject">
                        <option value="">choisir</option>
                        <option value="1" data-category="Développement Web" data-description="Structure et style des pages web.">HTML/CSS</option>
                        <option value="2" data-category="Développement Web" data-description="Langage de programmation côté client.">JavaScript</option>
                        <option value="3" data-category="Développement Web" data-description="Bibliothèques modernes pour interfaces utilisateur.">Frameworks JavaScript (React, Vue.js)</option>
                        <option value="4" data-category="Développement Web" data-description="Logique serveur et gestion des données.">Développement Backend (Node.js, PHP)</option>
                        <option value="5" data-category="Développement Web" data-description="Gestion et requête des données.">Bases de données (SQL, NoSQL)</option>
                        <option value="7" data-category="Développement Web" data-description="Adaptation aux différents appareils.">Responsive Design et Mobile First</option>
                        <option value="12" data-category="Développement Web" data-description="Échanges de données entre services.">APIs et Services Web (REST, GraphQL)</option>
                        <option value="13" data-category="Développement Web" data-description="Qualité du code et déploiement automatisé.">Tests unitaires et intégration continue</option>
                        <option value="14" data-category="Développement Web" data-description="Protection contre les menaces.">Sécurité web</option>
                        <option value="15" data-category="Développement Web" data-description="Outils de gestion de contenu et de vente en ligne.">CMS et e-commerce (WordPress, Shopify)</option>
                        <option value="16" data-category="Développement Web" data-description="Mise en ligne et maintenance du site.">Hébergement et déploiement</option>

                        <option value="6" data-category="UX/Design" data-description="Expérience utilisateur et conception d'interfaces.">UX/UI Design</option>
                        <option value="24" data-category="UX/Design" data-description="Logiciels de création visuelle.">Design graphique et logiciels (Photoshop, Illustrator)</option>
                        <option value="25" data-category="UX/Design" data-description="Création de l'image de marque.">Identité visuelle et branding</option>
                        <option value="26" data-category="UX/Design" data-description="Principes fondamentaux du visuel.">Théorie des couleurs et typographie</option>
                        <option value="27" data-category="UX/Design" data-description="Éléments graphiques et illustrations.">Création d'icônes et illustrations</option>
                        <option value="28" data-category="UX/Design" data-description="Mouvement et effets visuels.">Animation et motion design (After Effects)</option>
                        <option value="29" data-category="UX/Design" data-description="Maquettes interactives et conception.">Prototypage et maquettage (Figma, Sketch)</option>
                        <option value="30" data-category="UX/Design" data-description="Optimisation des images pour le web.">Photographie web et retouche d'images</option>

                        <option value="8" data-category="Gestion/Transverse" data-description="Méthodes de travail collaboratives.">Gestion de projet web (Agile, Scrum)</option>
                        <option value="9" data-category="Gestion/Transverse" data-description="Suivi des modifications de code.">Versioning (Git, GitHub)</option>
                        <option value="10" data-category="Gestion/Transverse" data-description="Règles pour un web inclusif.">Accessibilité web (WCAG)</option>
                        <option value="17" data-category="Gestion/Transverse" data-description="Suivi des nouveautés technologiques.">Veille technologique</option>
                        <option value="18" data-category="Gestion/Transverse" data-description="Législation et protection des données.">Droit du numérique et RGPD</option>
                        <option value="19" data-category="Gestion/Transverse" data-description="Interactions en milieu professionnel.">Communication professionnelle</option>
                        <option value="20" data-category="Gestion/Transverse" data-description="Vocabulaire spécifique au domaine.">Anglais technique</option>
                        <option value="21" data-category="Gestion/Transverse" data-description="Projet pédagogique encadré.">Projet tuteuré</option>
                        <option value="22" data-category="Gestion/Transverse" data-description="Expérience professionnelle en entreprise.">Stage en entreprise</option>
                        <option value="23" data-category="Gestion/Transverse" data-description="Document de synthèse d'expérience.">Mémoire professionnel</option>

                        <option value="11" data-category="Marketing Digital" data-description="Optimisation pour les moteurs de recherche.">SEO et Référencement</option>
                        <option value="31" data-category="Marketing Digital" data-description="Planification des actions en ligne.">Marketing digital et stratégie web</option>
                        <option value="32" data-category="Marketing Digital" data-description="Gestion de la présence sur les plateformes sociales.">Réseaux sociaux et community management</option>
                        <option value="33" data-category="Marketing Digital" data-description="Création de contenu pertinent.">Content marketing et rédaction web</option>
                        <option value="34" data-category="Marketing Digital" data-description="Campagnes par e-mail et automatisation.">E-mail marketing et automation</option>
                        <option value="35" data-category="Marketing Digital" data-description="Campagnes payantes en ligne.">Publicité en ligne (Google Ads, Facebook Ads)</option>
                        <option value="36" data-category="Marketing Digital" data-description="Mesure de l'audience et des performances.">Analytics et mesure de performance (Google Analytics)</option>
                        <option value="37" data-category="Marketing Digital" data-description="Optimisation des chemins de conversion UX.">Conversion et optimisation UX</option>
                        <option value="38" data-category="Marketing Digital" data-description="Partenariats avec des influenceurs.">Influence marketing et partenariats</option>
                        <option value="39" data-category="Marketing Digital" data-description="Techniques d'acquisition et de croissance rapide.">Growth hacking et acquisition client</option>
                        <option value="40" data-category="Marketing Digital" data-description="Promotion et gestion de la réputation en ligne.">Webmarketing et e-reputation</option>
                    </select>
                    <label for="skillsLevel">Niveau de Compétence :</label>
                    <select id="skillsLevel" name="skillsLevel">
                        <option value="">choisir</option>
                        <option value="1" data-description="Découverte des concepts de base" data-experience="0-6 mois">débutant</option>
                        <option value="2" data-description="Compréhension des fondamentaux" data-experience="6 mois - 1 an">initié</option>
                        <option value="3" data-description="Application pratique autonome" data-experience="1-2 ans">intermédiaire</option>
                        <option value="4" data-description="Maîtrise des techniques avancées" data-experience="2-3 ans">confirmé</option>
                        <option value="5" data-description="Expertise technique approfondie" data-experience="3-5 ans">avancé</option>
                        <option value="6" data-description="Maîtrise complète et innovation" data-experience="5+ ans">expert</option>
                        <option value="7" data-description="Leadership technique et mentorat" data-experience="7+ ans">expert confirmé</option>
                        <option value="8" data-description="Référence dans le domaine" data-experience="10+ ans">maître</option>
                    </select>
                    <label for="difficultyRating">Difficulté Estimée :</label>
                    <select id="difficultyRating" name="difficultyRating">
                        <option value="">choisir</option>
                        <option value="1" data-note="Niveau débutant - concepts de base">facile</option>
                        <option value="2" data-note="Niveau intermédiaire - pratique régulière">moyen</option>
                        <option value="3" data-note="Niveau avancé - expertise technique">difficile</option>
                        <option value="4" data-note="Niveau expert - maîtrise complète">très difficile</option>
                    </select>
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5"></textarea>
                    <label for="taskProgression">Progression de la Tâche :</label>
                    <select id="taskProgression" name="taskProgression">
                        <option value="">choisir</option>
                        <option value="1">Nouvelle tâche</option>
                        <option value="2">conception</option>
                        <option value="3">en cours</option>
                        <option value="4">bloqué</option>
                        <option value="5">en attente de validation</option>
                        <option value="6">Terminé</option>
                        <option value="7">Archivé</option>
                    </select>
                </fieldset>
                <fieldset class="form-group__fieldset" id="programming-and-deadline">
                    <legend class="form-group__fieldset--legend">Planification et échéance:</legend>
                    <label for="priorityStatus">Statut de Priorité :</label>
                    <select id="priorityStatus" name="priorityStatus">
                        <option value="">choisir</option>
                        <option value="1">Important</option>
                        <option value="2">Haut</option>
                        <option value="3">Moyen</option>
                        <option value="4">Bas</option>
                        <option value="5">Non important</option>
                    </select>
                    <label for="date_de_completion">Date échéance</label>
                    <input type="date" id="date_de_completion" name="date_de_completion">
                    <label for="timer">Temps consacré à la réalisation</label>
                    <input type="number" id="timer" name="timer">
                </fieldset>
                <fieldset class="form-group__fieldset" id="documentation-and-files">
                    <legend class="form-group__fieldset--legend">Documentation et Fichiers</legend>

                    <div class="form-group__fieldset">
                        <label for="fichiers_joints" class="button__upload--personalize">📥 Déposer des Fichiers Joints</label>
                        <input type="file" id="fichiers_joints" name="fichiers_joints[]" multiple>
                    </div>

                    <div class="form-group__fieldset">
                        <label for="docFileUrl">Liens de documentation (URL)</label>
                        <div class="file-list" id="doc-list">
                            <input id="docFileUrl" type="url" name="documentation[]" placeholder="https://exemple.com/doc1">
                        </div>
                        <button type="button" class="btn-add" onclick="ajouterDoc()">+ Ajouter un lien</button>
                    </div>
                </fieldset>
                <fieldset class="form-group__fieldset" id="subTaskFieldset">
                    <legend class="form-group__fieldset--legend">Sous-Tâches Associées</legend>
                    <section class="subtask-section">
                        <div class="subtask-section__container">
                            <h3 class="subtask-section__container--title">To Do A (Préparation/Structure)</h3>
                            <div class="subtask-section__container--field-item" id="todo-a-list">
                                <div class="subtask-section__container--field">
                                    <label for="subTaskA"></label>
                                    <input id="subTaskA" type="text" name="subTaskA[]" placeholder="sous-tâche (Ex: Structure HTML)">
                                    <label>
                                        <textarea  name="commentaireA[]" placeholder="Commentaire (Ex: Créer la structure sémantique)"></textarea>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="subtask-section">
                        <div class="subtask-section__container">
                            <h3 class="subtask-section__container--title">To Do B (Préparation/Structure)</h3>
                            <div class="subtask-section__container--field-item" id="todo-b-list">
                                <div class="subtask-section__container--field">
                                    <label for="subTaskB"></label>
                                    <input id="subTaskB" type="text" name="subTaskB[]" placeholder="sous-tâche (Ex: Structure HTML)">
                                    <label>
                                        <textarea  name="commentaireB[]" placeholder="Commentaire (Ex: Créer la structure sémantique)"></textarea>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>

                </fieldset>
                <fieldset class="form-group__fieldset" id="validation-fieldset">
                    <legend class="form-group__fieldset--legend">Validation de la tâche:</legend>
                    <div class="btn-group">
                        <input type="reset" value="Réinitialiser">
                        <input type="submit" value="Créer la tâche">
                    </div>
                </fieldset>
            </form>
        </section>
    </article>
</main>

</body>
</html>
